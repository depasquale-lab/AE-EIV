[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amortized-eiv"
version = "0.0.1"
description = "Amortized error-in-variables regression with a behavior-gated encoder and a learned prior"
requires-python = ">=3.10"
dependencies = ["jax", "optax", "numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["amortized_eiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
